# Builds the cross-OS headless Skiko worker JAR and its SHA-256 checksum on a version tag
# and attaches both to a GitHub release so the bundled Node MCP supervisor downloads and verifies them.
name: Release previewer worker

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  worker-jar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build worker JAR
        working-directory: app
        run: ./gradlew :app:workerJar --no-daemon
      - name: Generate SHA-256 and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/app/build/libs/android-design-preview.jar android-design-preview.jar
          sha256sum android-design-preview.jar > android-design-preview.jar.sha256
          gh release create "$GITHUB_REF_NAME" android-design-preview.jar android-design-preview.jar.sha256 --generate-notes
