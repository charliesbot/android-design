# Publishes a lightweight git tag v<version> when the plugin version changes on main, so the
# explore skill's scripts/android-design-preview sparse-checkouts app/ from that version tag. A push
# runs only when it changes plugin/plugin.json, and a version that already has a tag is skipped. A
# manual run (workflow_dispatch) on main tags the current version if it has no tag yet.
name: Tag previewer release

on:
  push:
    branches: [main]
    paths: ["plugin/plugin.json"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-previewer
  cancel-in-progress: false

jobs:
  tag-release:
    # A manual run from another branch must not tag that branch's code.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check plugin version tag
        id: version
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          version=$(jq -r .version plugin/plugin.json)
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          previous=""
          if [ "$EVENT" = "push" ]; then
            previous=$(git show "$BEFORE:plugin/plugin.json" 2>/dev/null | jq -r .version 2>/dev/null || true)
          fi
          if [ "$EVENT" = "push" ] && [ "$previous" = "$version" ]; then
            echo "Version stayed at $version, nothing to tag."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif git rev-parse -q --verify "refs/tags/$tag" >/dev/null 2>&1 || [ -n "$(git ls-remote --tags origin "refs/tags/$tag")" ]; then
            echo "Tag $tag already exists, nothing to tag."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create lightweight tag
        if: steps.version.outputs.exists == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
