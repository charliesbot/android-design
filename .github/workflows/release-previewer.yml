# Builds the previewer app's DMG and MSI on a version tag and attaches both to a GitHub release.
# The installers keep fixed names so the README can link to releases/latest/download.
name: Release previewer app

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  dmg:
    # Apple Silicon runner: the bundled JDK, and so the app, is arm64 only.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build DMG
        working-directory: app
        run: ./gradlew :app:packageDmg
      - run: cp app/app/build/compose/binaries/main/dmg/*.dmg AndroidDesignPreview.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: AndroidDesignPreview.dmg

  msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build MSI
        working-directory: app
        run: ./gradlew.bat :app:packageMsi
      - run: Copy-Item app/app/build/compose/binaries/main/msi/*.msi AndroidDesignPreview.msi
      - uses: actions/upload-artifact@v4
        with:
          name: msi
          path: AndroidDesignPreview.msi

  publish:
    needs: [dmg, msi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" AndroidDesignPreview.dmg AndroidDesignPreview.msi
          --repo "$GITHUB_REPOSITORY" --generate-notes
