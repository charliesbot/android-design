# Builds the previewer app's DMG on a version tag and attaches it to a GitHub release.
# The DMG keeps a fixed name so the README can link to releases/latest/download.
name: Release previewer app

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  dmg:
    # Apple Silicon runner: the bundled JDK, and so the app, is arm64 only.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build DMG
        working-directory: app
        run: ./gradlew :app:packageDmg
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/app/build/compose/binaries/main/dmg/*.dmg AndroidDesignPreview.dmg
          gh release create "$GITHUB_REF_NAME" AndroidDesignPreview.dmg --generate-notes
