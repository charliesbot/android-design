# Builds the previewer app's DMG and MSI on a version tag and attaches both to a GitHub release.
# The installers keep fixed names so the README can link to releases/latest/download.
name: Release previewer app

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    # The same build that runs on pull requests, signed when the signing secrets are set.
    uses: ./.github/workflows/build-previewer.yml
    secrets: inherit

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" AndroidDesignPreview.dmg AndroidDesignPreview.msi
          --repo "$GITHUB_REPOSITORY" --generate-notes
