<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checker fixture</title>
  <link rel="stylesheet" href="/runtime/runtime.css">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="/runtime/m3e.js"></script>
</head>
<body>
  <!-- Known-bad and known-good component text, to prove runtimeChecks() measures what the user sees. -->
  <m3e-theme color="#6750A4" variant="tonal-spot" scheme="light">
    <main class="screen">
      <m3e-button id="good" variant="filled" data-primary>Good filled</m3e-button>
      <m3e-button id="low" variant="filled" class="low">Low contrast label</m3e-button>
      <m3e-button id="clipped" variant="filled" class="clipped">A label far too long for this button</m3e-button>
      <div class="clip-box"><p class="t-body-medium">Plain HTML text that wraps onto several lines inside a box that is only one line tall, so the lower lines are cut off.</p></div>
      <m3e-icon-button id="icon" aria-label="Search"><p-icon name="search"></p-icon></m3e-icon-button>
    </main>
  </m3e-theme>
</body>
</html>
