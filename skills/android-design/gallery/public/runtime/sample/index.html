<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Runtime sample</title>
  <link rel="stylesheet" href="/runtime/runtime.css">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="/runtime/m3e.js"></script>
</head>
<body>
  <m3e-theme color="#6750A4" variant="tonal-spot" scheme="light">
    <main class="screen">
      <h1 class="t-headline-large-em">Tonight</h1>
      <m3e-card variant="filled" class="note">
        <div class="note-body">
          <p-icon name="restaurant" filled></p-icon>
          <div>
            <h2 class="t-title-medium-em">Shakshuka</h2>
            <p class="t-body-medium">25 min, 2 servings</p>
          </div>
        </div>
      </m3e-card>
      <m3e-button variant="filled" size="large" class="start" data-primary>Start cooking</m3e-button>
    </main>
    <p-floating-toolbar>
      <m3e-toolbar>
        <m3e-button toggle selected variant="tonal"><p-icon slot="icon" name="home"></p-icon>Tonight</m3e-button>
        <m3e-button toggle variant="text"><p-icon slot="icon" name="favorite"></p-icon>Saved</m3e-button>
        <m3e-button toggle variant="text"><p-icon slot="icon" name="calendar_month"></p-icon>Plan</m3e-button>
      </m3e-toolbar>
    </p-floating-toolbar>
  </m3e-theme>
</body>
</html>
