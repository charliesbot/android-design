<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design Picks</title>
<style>
  :root {
    --bg: #f4f3f1; --panel: #ffffff; --ink: #1c1b1a; --muted: #6b6864; --line: #dedbd6;
    --best: #1f7a4d; --best-bg: #dff3e7; --worst: #b3261e; --worst-bg: #fbe3e1; --accent: #3a57c4;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151514; --panel: #1f1f1d; --ink: #ecebe8; --muted: #9c9993; --line: #34332f;
      --best: #6fd49c; --best-bg: #17382a; --worst: #ff8a80; --worst-bg: #3d1c19; --accent: #9db0ff; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, sans-serif; }
  header { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line);
    padding: 12px 20px; display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; }
  h1 { font-size: 18px; margin: 0; }
  .count { color: var(--muted); }
  .dots { display: flex; gap: 6px; }
  .dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); background: none;
    cursor: pointer; font-size: 10px; color: var(--muted); padding: 0; }
  .dot.done { background: var(--best); border-color: var(--best); color: var(--panel); }
  .dot.current { outline: 2px solid var(--accent); outline-offset: 2px; }
  .views { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; margin-left: auto; }
  .views button { border: 0; background: none; color: var(--ink); padding: 6px 14px; cursor: pointer; font: inherit; }
  .views button.on { background: var(--ink); color: var(--bg); }
  main { padding: 16px 20px 40px; max-width: 1500px; margin: 0 auto; }
  details { color: var(--muted); margin-bottom: 14px; }
  summary { cursor: pointer; }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  .variant { background: var(--panel); border: 2px solid var(--line); border-radius: 16px; padding: 12px;
    display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .variant.best { border-color: var(--best); background: var(--best-bg); }
  .variant.worst { border-color: var(--worst); background: var(--worst-bg); }
  .variant img { max-width: 100%; max-height: calc(100vh - 330px); min-height: 200px; border-radius: 10px;
    cursor: zoom-in; display: block; }
  .placeholder { height: 400px; display: grid; place-items: center; color: var(--muted); text-align: center; }
  .label { font-weight: 600; }
  .actions { display: flex; gap: 8px; }
  .actions button, .nav button, .none { font: inherit; border-radius: 999px; padding: 6px 14px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
  .actions .b.on { background: var(--best); border-color: var(--best); color: var(--panel); }
  .actions .w.on { background: var(--worst); border-color: var(--worst); color: var(--panel); }
  kbd { font: 11px ui-monospace, monospace; color: var(--muted); }
  .why { display: grid; grid-template-columns: max-content 1fr; gap: 10px 14px; margin-top: 18px; align-items: start; }
  .why .k { color: var(--muted); padding-top: 5px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    border-radius: 999px; padding: 4px 11px; cursor: pointer; }
  .chip.on.good { background: var(--best); border-color: var(--best); color: var(--panel); }
  .chip.on.bad { background: var(--worst); border-color: var(--worst); color: var(--panel); }
  textarea { width: 100%; min-height: 60px; font: inherit; padding: 8px 10px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
  .none.on { background: var(--worst); border-color: var(--worst); color: var(--panel); }
  .nav { display: flex; justify-content: space-between; margin-top: 20px; align-items: center; }
  .saved { color: var(--muted); font-size: 13px; }
  .lightbox { position: fixed; inset: 0; background: rgb(0 0 0 / 85%); display: none; z-index: 5;
    align-items: center; justify-content: center; cursor: zoom-out; }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 96vw; max-height: 96vh; }
  table { border-collapse: collapse; width: 100%; background: var(--panel); border-radius: 12px; overflow: hidden; }
  td, th { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  @media (max-width: 900px) {
    .grid { grid-template-columns: 1fr; }
    .variant img { max-height: none; }
    .views { margin-left: 0; }
    .why { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <h1>Design picks</h1>
  <span class="count" id="count"></span>
  <div class="dots" id="dots"></div>
  <div class="views" id="views"></div>
</header>
<main id="main"></main>
<div class="lightbox" id="lightbox"><img alt=""></div>

<script>
const VIEWS = [["light", "Light", "L"], ["dark", "Dark", "D"], ["font200", "200% text", "F"], ["wallpaper", "Wallpaper", "W"]];
const GOOD = ["hierarchy", "color", "typography", "shape", "spacing", "layout", "components", "hero moment", "details", "feels native"];
const BAD = ["weak hierarchy", "color", "typography", "shape", "spacing", "layout", "components", "generic", "too busy", "hard to read", "broken"];

let round = null, index = 0, view = "light";

const empty = () => ({ best: null, worst: null, none_good: false, good: [], bad: [], note: "" });
const pickFor = name => round.selections[name] || (round.selections[name] = empty());

async function load() {
  round = await (await fetch("/api/round")).json();
  const firstOpen = round.cases.findIndex(c => !isDone(c.name));
  if (index === 0 && firstOpen > 0) index = firstOpen;
  render();
  if (round.cases.some(c => c.variants.some(v => v.status === "pending"))) setTimeout(refresh, 20000);
}

async function refresh() {
  const fresh = await (await fetch("/api/round")).json();
  round.cases = fresh.cases;
  if (!document.activeElement || document.activeElement.tagName !== "TEXTAREA") render();
  if (fresh.cases.some(c => c.variants.some(v => v.status === "pending"))) setTimeout(refresh, 20000);
}

function isDone(name) {
  const p = round.selections[name];
  return p && (p.best || p.none_good);
}

let saveTimer = null;
function save(name) {
  clearTimeout(saveTimer);
  const status = document.getElementById("saved");
  if (status) status.textContent = "saving";
  saveTimer = setTimeout(async () => {
    await fetch("/api/select", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ case: name, ...pickFor(name), at: new Date().toISOString() }) });
    const s = document.getElementById("saved");
    if (s) s.textContent = "saved";
    renderHeader();
  }, 250);
}

function renderHeader() {
  const done = round.cases.filter(c => isDone(c.name)).length;
  document.getElementById("count").textContent = `${done} of ${round.cases.length} picked`;
  const dots = document.getElementById("dots");
  dots.innerHTML = "";
  round.cases.forEach((c, i) => {
    const b = document.createElement("button");
    b.className = "dot" + (isDone(c.name) ? " done" : "") + (i === index ? " current" : "");
    b.title = c.name;
    b.textContent = i + 1;
    b.onclick = () => { index = i; render(); };
    dots.appendChild(b);
  });
  const done_ = document.createElement("button");
  done_.className = "dot" + (index === round.cases.length ? " current" : "");
  done_.title = "summary";
  done_.textContent = "✓";
  done_.onclick = () => { index = round.cases.length; render(); };
  dots.appendChild(done_);
  const views = document.getElementById("views");
  views.innerHTML = "";
  for (const [id, label, key] of VIEWS) {
    const b = document.createElement("button");
    b.className = id === view ? "on" : "";
    b.innerHTML = `${label} <kbd>${key}</kbd>`;
    b.onclick = () => { view = id; render(); };
    views.appendChild(b);
  }
}

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  Object.entries(attrs).forEach(([k, v]) => k.startsWith("on") ? node[k] = v : node.setAttribute(k, v));
  children.flat().forEach(c => node.append(c));
  return node;
}

function chipRow(name, list, kind) {
  const p = pickFor(name);
  return el("div", { class: "chips" }, list.map(label => el("button", {
    class: `chip ${kind}` + (p[kind].includes(label) ? " on" : ""),
    onclick: () => {
      p[kind] = p[kind].includes(label) ? p[kind].filter(x => x !== label) : [...p[kind], label];
      save(name); render();
    },
  }, label)));
}

function setPick(name, slot, id) {
  const p = pickFor(name);
  p[slot] = p[slot] === id ? null : id;
  const other = slot === "best" ? "worst" : "best";
  if (p[other] === id) p[other] = null;
  if (slot === "best" && p.best) p.none_good = false;
  save(name); render();
}

function renderCase() {
  const c = round.cases[index];
  const p = pickFor(c.name);
  const main = document.getElementById("main");
  main.innerHTML = "";
  main.append(
    el("h2", {}, `${index + 1}. ${c.name}`),
    el("details", {}, el("summary", {}, "The brief every variant got"), el("p", {}, c.prompt)),
  );
  const grid = el("div", { class: "grid" });
  c.variants.forEach((v, i) => {
    const file = `${view}.png`;
    let visual;
    if (v.status === "ok" && v.renders.includes(file)) {
      visual = el("img", { src: `/renders/${c.name}/${v.id}/${file}`, alt: `${c.name} ${v.id} ${view}`,
        onclick: e => { const lb = document.getElementById("lightbox"); lb.querySelector("img").src = e.target.src; lb.classList.add("open"); } });
    } else {
      visual = el("div", { class: "placeholder" }, v.status === "pending" ? "Still building. This page refreshes itself." : "This variant did not render.");
    }
    const card = el("div", { class: "variant" + (p.best === v.id ? " best" : "") + (p.worst === v.id ? " worst" : "") },
      el("span", { class: "label" }, `Variant ${String.fromCharCode(65 + i)}`),
      visual,
      el("div", { class: "actions" },
        el("button", { class: "b" + (p.best === v.id ? " on" : ""), onclick: () => setPick(c.name, "best", v.id) }, "Best ", el("kbd", {}, String(i + 1))),
        el("button", { class: "w" + (p.worst === v.id ? " on" : ""), onclick: () => setPick(c.name, "worst", v.id) }, "Worst ", el("kbd", {}, `⇧${i + 1}`)),
      ),
    );
    grid.append(card);
  });
  main.append(grid);

  const note = el("textarea", { placeholder: "Optional: one line on what decided it" });
  note.value = p.note;
  note.oninput = () => { p.note = note.value; save(c.name); };
  main.append(el("div", { class: "why" },
    el("span", { class: "k" }, "Best wins on"), chipRow(c.name, GOOD, "good"),
    el("span", { class: "k" }, "Worst fails on"), chipRow(c.name, BAD, "bad"),
    el("span", { class: "k" }, "Note"), note,
  ));
  main.append(el("div", { class: "nav" },
    el("button", { onclick: () => go(-1) }, "← Back"),
    el("button", { class: "none" + (p.none_good ? " on" : ""), onclick: () => {
      p.none_good = !p.none_good; if (p.none_good) p.best = null; save(c.name); render();
    } }, "None are good ", el("kbd", {}, "N")),
    el("span", { class: "saved", id: "saved" }, ""),
    el("button", { onclick: () => go(1) }, "Next →"),
  ));
}

function renderSummary() {
  const main = document.getElementById("main");
  main.innerHTML = "";
  const done = round.cases.filter(c => isDone(c.name)).length;
  main.append(el("h2", {}, done === round.cases.length ? "All picked. Tell Claude you're done." : `${round.cases.length - done} cases still need a pick.`));
  const letter = id => id ? String.fromCharCode(64 + Number(id.slice(1))) : "–";
  const rows = round.cases.map((c, i) => {
    const p = round.selections[c.name] || empty();
    return el("tr", { onclick: () => { index = i; render(); }, style: "cursor:pointer" },
      el("td", {}, c.name), el("td", {}, p.none_good ? "none good" : letter(p.best)), el("td", {}, letter(p.worst)),
      el("td", {}, [...p.good, ...p.bad.map(b => "✗ " + b)].join(", ")), el("td", {}, p.note));
  });
  main.append(el("table", {}, el("tr", {}, ["Case", "Best", "Worst", "Reasons", "Note"].map(h => el("th", {}, h))), rows));
}

function render() {
  renderHeader();
  index === round.cases.length ? renderSummary() : renderCase();
}

function go(step) {
  index = Math.max(0, Math.min(round.cases.length, index + step));
  render();
  window.scrollTo(0, 0);
}

document.getElementById("lightbox").onclick = e => e.currentTarget.classList.remove("open");
document.addEventListener("keydown", e => {
  if (e.target.tagName === "TEXTAREA" || e.metaKey || e.ctrlKey) return;
  if (e.key === "Escape") return document.getElementById("lightbox").classList.remove("open");
  if (e.key === "ArrowRight") return go(1);
  if (e.key === "ArrowLeft") return go(-1);
  const view_ = VIEWS.find(v => v[2].toLowerCase() === e.key.toLowerCase());
  if (view_) { view = view_[0]; return render(); }
  if (index >= round.cases.length) return;
  const c = round.cases[index];
  const digit = e.code.match(/^Digit([1-9])$/);
  if (digit && Number(digit[1]) <= c.variants.length) return setPick(c.name, e.shiftKey ? "worst" : "best", `v${digit[1]}`);
  if (e.key.toLowerCase() === "n") { const p = pickFor(c.name); p.none_good = !p.none_good; if (p.none_good) p.best = null; save(c.name); render(); }
});

load();
</script>
</body>
</html>
