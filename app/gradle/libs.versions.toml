# Pinned toolchain for the v6 previewer. Change versions only on purpose.
[versions]
kotlin = "2.4.21"
materialKolor = "5.0.1"
kotlinxSerialization = "1.12.0"
coroutines = "1.11.0"
kaml = "0.104.0"
junit = "5.14.4"
spotless = "8.10.4"
jetbrainsAnnotations = "26.1.0"
agp = "9.5.0"
androidxComposeBom = "2026.11.01"
androidxMaterial3 = "1.5.0"
androidxNavigation3 = "1.2.2"
androidxAdaptive = "1.3.0"
androidxActivityCompose = "1.13.0"
androidxNavigationEvent = "1.1.2"
androidxWearCompose = "1.8.0-alpha03"
lz4 = "1.8.0"
robolectric = "4.18.1"
junit4 = "4.13.2"
layoutlib = "17.0.4"
androidTools = "32.5.3"
bytebuddy = "1.18.7"
kxml2 = "2.3.0"

[libraries]
material-kolor = { module = "com.materialkolor:material-kolor", version.ref = "materialKolor" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kaml = { module = "com.charleskorn.kaml:kaml", version.ref = "kaml" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
kotlin-compiler-embeddable = { module = "org.jetbrains.kotlin:kotlin-compiler-embeddable", version.ref = "kotlin" }
kotlin-compose-compiler-embeddable = { module = "org.jetbrains.kotlin:kotlin-compose-compiler-plugin-embeddable", version.ref = "kotlin" }
jetbrains-annotations = { module = "org.jetbrains:annotations", version.ref = "jetbrainsAnnotations" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "androidxComposeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling-data = { module = "androidx.compose.ui:ui-tooling-data" }
