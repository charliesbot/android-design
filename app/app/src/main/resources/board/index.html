<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Android Design Preview Board</title>
  <style nonce="{{NONCE}}">
    :root {
      color-scheme: light dark;
      --bg: #111318;
      --surface: #1b1e26;
      --surface-2: #242833;
      --border: #323746;
      --text: #e6e8ef;
      --muted: #9aa1b3;
      --accent: #7aa2ff;
      --pass: #4cc38a;
      --fail: #f26d6d;
      --warn: #e5a94c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 18px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .brand { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .brand h1 { font-size: 15px; margin: 0; font-weight: 600; }
    .pill {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .pill.pass { color: var(--pass); border-color: rgba(76, 195, 138, 0.4); }
    .pill.fail { color: var(--fail); border-color: rgba(242, 109, 109, 0.4); }
    .pill.stale { color: var(--warn); border-color: rgba(229, 169, 76, 0.45); }
    .toolbar-tabs { display: flex; gap: 6px; align-items: center; }
    button, select, input {
      font: inherit;
      color: var(--text);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 13px;
    }
    button { cursor: pointer; }
    button.active { background: var(--accent); color: #0b1020; border-color: var(--accent); font-weight: 600; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    main { flex: 1; padding: 18px; display: flex; flex-direction: column; gap: 16px; }
    .banner {
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid rgba(242, 109, 109, 0.45);
      background: rgba(242, 109, 109, 0.08);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      white-space: pre-wrap;
    }
    .banner.warn {
      border-color: rgba(229, 169, 76, 0.55);
      background: rgba(229, 169, 76, 0.1);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 16px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: opacity 150ms ease;
    }
    .card.is-stale .card-preview img { opacity: 0.45; filter: saturate(0.5); }
    .card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .card-title { font-weight: 600; font-size: 14px; }
    .card-preview {
      background: #0d0f13;
      border: 1px solid var(--border);
      border-radius: 8px;
      min-height: 240px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: pointer;
      position: relative;
    }
    .card-preview img { max-width: 100%; max-height: 460px; display: block; object-fit: contain; }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      align-items: flex-end;
    }
    .field { display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: var(--muted); }
    .field-row { display: flex; gap: 6px; align-items: center; }
    .seed-picker { width: 34px; height: 31px; padding: 2px; cursor: pointer; }
    .seed-hex { width: 92px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .stage-layout {
      display: grid;
      grid-template-columns: minmax(320px, 1fr) 340px;
      gap: 16px;
      align-items: start;
    }
    @media (max-width: 960px) {
      .stage-layout { grid-template-columns: 1fr; }
    }
    .viewport-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      position: relative;
    }
    .frame-box {
      position: relative;
      display: inline-block;
      line-height: 0;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
      max-width: 100%;
    }
    .frame-box.is-stale img { opacity: 0.5; filter: saturate(0.5); }
    .frame-box img {
      display: block;
      max-width: 100%;
      max-height: 76vh;
      width: auto;
      height: auto;
      user-select: none;
    }
    .frame-box svg.overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }
    .frame-box svg.overlay rect.node {
      fill: transparent;
      stroke: rgba(122, 162, 255, 0.25);
      stroke-width: 1;
      vector-effect: non-scaling-stroke;
    }
    .frame-box svg.overlay rect.node:hover,
    .frame-box svg.overlay rect.node.selected {
      fill: rgba(122, 162, 255, 0.14);
      stroke: #7aa2ff;
      stroke-width: 2;
    }
    .frame-box svg.overlay rect.node.primary {
      stroke: rgba(76, 195, 138, 0.65);
    }
    .inspector {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      font-size: 13px;
    }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
    .selected-source { margin-top: 4px; word-break: break-all; }
    .stage-findings { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
    .node-list { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; max-height: 280px; overflow: auto; }
    .node-item { text-align: left; padding: 4px 6px; }
    .card-meta { color: var(--muted); }
    .finding { padding: 8px; border-radius: 6px; background: var(--surface-2); font-size: 12px; }
    .finding.error { border-left: 3px solid var(--fail); }
    .finding.info { border-left: 3px solid var(--warn); }
    .hover-hud {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
      border-top: 1px solid var(--border);
      padding-top: 8px;
    }
    .toast {
      position: fixed;
      bottom: 18px;
      right: 18px;
      padding: 10px 14px;
      border-radius: 8px;
      background: #1f2937;
      border: 1px solid var(--accent);
      color: #f9fafb;
      font-size: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      opacity: 0;
      pointer-events: none;
      transition: opacity 150ms ease;
    }
    .toast.visible { opacity: 1; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1 id="board-title">Android Design Preview</h1>
      <span id="surface-pill" class="pill">loading</span>
      <span id="status-pill" class="pill">waiting</span>
      <span id="live-pill" class="pill">SSE connecting</span>
    </div>
    <div class="toolbar-tabs">
      <button id="tab-grid" type="button" class="active">All Directions</button>
      <button id="tab-stage" type="button">Focus Stage</button>
    </div>
  </header>

  <main>
    <div id="halted-banner" class="banner warn hidden"></div>
    <div id="error-banner" class="banner hidden"></div>
    <section id="grid-view" class="grid"></section>
    <section id="stage-view" class="hidden">
      <div class="controls">
        <div class="field">
          <label for="ctrl-direction">Direction</label>
          <select id="ctrl-direction"></select>
        </div>
        <div class="field">
          <label>Brightness</label>
          <div class="field-row">
            <button id="btn-light" type="button">Light</button>
            <button id="btn-dark" type="button">Dark</button>
          </div>
        </div>
        <div class="field">
          <label for="ctrl-seed-hex">Seed Color</label>
          <div class="field-row">
            <input id="ctrl-seed-picker" class="seed-picker" type="color" value="#6750A4">
            <input id="ctrl-seed-hex" class="seed-hex" type="text" value="#6750A4" maxlength="9">
            <button id="btn-seed-reset" type="button">Reset</button>
          </div>
        </div>
        <div class="field">
          <label for="ctrl-variant">Style Variant</label>
          <select id="ctrl-variant"></select>
        </div>
        <div class="field">
          <label for="ctrl-screen">Screen</label>
          <select id="ctrl-screen"></select>
        </div>
        <div class="field">
          <label for="ctrl-overlay">Overlay</label>
          <select id="ctrl-overlay"></select>
        </div>
        <div class="field">
          <label for="ctrl-view">Device</label>
          <select id="ctrl-view"></select>
        </div>
        <div class="field">
          <label>Inspector</label>
          <div class="field-row">
            <button id="btn-toggle-boxes" type="button" class="active">Boxes</button>
            <button id="btn-scroll-frame" type="button" class="hidden">Top Frame</button>
          </div>
        </div>
      </div>

      <div class="stage-layout">
        <div class="viewport-wrap">
          <div id="frame-box" class="frame-box">
            <img id="stage-img" alt="Rendered screen preview">
            <svg id="stage-svg" class="overlay" aria-label="Interactive component overlay"></svg>
          </div>
          <div class="hover-hud">
            <span id="hover-info" class="mono">Hover a component box to inspect; click to select and copy source location.</span>
            <span id="render-meta" class="mono"></span>
          </div>
        </div>

        <aside class="inspector">
          <div>
            <strong>Selected Source</strong>
            <div id="selected-source" class="mono selected-source">none selected</div>
          </div>
          <div>
            <strong>Render Checks</strong>
            <div id="stage-findings" class="stage-findings"></div>
          </div>
          <div>
            <strong>Layout &amp; Navigation Nodes</strong>
            <div id="node-list" class="node-list"></div>
          </div>
        </aside>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script nonce="{{NONCE}}">
    const VARIANTS = [
      { value: "tonal-spot", label: "Tonal Spot" },
      { value: "expressive", label: "Expressive" },
      { value: "vibrant", label: "Vibrant" },
      { value: "neutral", label: "Neutral" },
      { value: "monochrome", label: "Monochrome" },
      { value: "content", label: "Content" },
      { value: "fidelity", label: "Fidelity" },
      { value: "rainbow", label: "Rainbow" },
      { value: "fruit-salad", label: "Fruit Salad" }
    ];
    const VIEW_TOKEN = new URLSearchParams(window.location.search).get("view") || "";

    const state = {
      board: null,
      mode: "grid",
      direction: null,
      screen: null,
      overlay: "",
      view: null,
      dark: null,
      seed: null,
      variant: null,
      showBoxes: true,
      showEndFrame: false,
      stageRender: null,
      viewsByKey: new Map(),
      staleKeys: new Set(),
      selectedNode: null,
      halted: false,
    };

    const els = {
      title: document.getElementById("board-title"),
      surfacePill: document.getElementById("surface-pill"),
      statusPill: document.getElementById("status-pill"),
      livePill: document.getElementById("live-pill"),
      haltedBanner: document.getElementById("halted-banner"),
      errorBanner: document.getElementById("error-banner"),
      tabGrid: document.getElementById("tab-grid"),
      tabStage: document.getElementById("tab-stage"),
      gridView: document.getElementById("grid-view"),
      stageView: document.getElementById("stage-view"),
      ctrlDirection: document.getElementById("ctrl-direction"),
      btnLight: document.getElementById("btn-light"),
      btnDark: document.getElementById("btn-dark"),
      ctrlSeedPicker: document.getElementById("ctrl-seed-picker"),
      ctrlSeedHex: document.getElementById("ctrl-seed-hex"),
      btnSeedReset: document.getElementById("btn-seed-reset"),
      ctrlVariant: document.getElementById("ctrl-variant"),
      ctrlScreen: document.getElementById("ctrl-screen"),
      ctrlOverlay: document.getElementById("ctrl-overlay"),
      ctrlView: document.getElementById("ctrl-view"),
      btnToggleBoxes: document.getElementById("btn-toggle-boxes"),
      btnScrollFrame: document.getElementById("btn-scroll-frame"),
      frameBox: document.getElementById("frame-box"),
      stageImg: document.getElementById("stage-img"),
      stageSvg: document.getElementById("stage-svg"),
      hoverInfo: document.getElementById("hover-info"),
      renderMeta: document.getElementById("render-meta"),
      selectedSource: document.getElementById("selected-source"),
      stageFindings: document.getElementById("stage-findings"),
      nodeList: document.getElementById("node-list"),
      toast: document.getElementById("toast"),
    };

    function viewKey(direction, screen, overlay, view) {
      return [direction || "", screen || "", overlay || "", view || ""].join("\0");
    }

    function showToast(text) {
      els.toast.textContent = text;
      els.toast.classList.add("visible");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => els.toast.classList.remove("visible"), 1800);
    }

    async function apiPost(path, body) {
      const res = await fetch(path, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-View-Token": VIEW_TOKEN,
        },
        body: JSON.stringify(body),
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({ error: "HTTP " + res.status }));
        throw new Error(err.message || err.error || "Request failed");
      }
      return res.json();
    }

    function reportFocus() {
      if (!state.board?.sourcePath) return;
      const defaultView = state.board.surface === "wear" ? "watch" : "light";
      apiPost("/api/board/focus", {
        path: state.board.sourcePath,
        direction: state.direction || state.board.boardMeta?.directions?.[0]?.name || "",
        screen: state.screen || currentDirectionMeta()?.startScreen || "",
        overlay: state.overlay || null,
        view: state.view || defaultView,
      }).catch(() => {});
    }

    function buildCallChain(node, nodes) {
      const byId = new Map();
      for (const n of nodes || []) byId.set(n.id, n);
      const chain = [];
      const seen = new Set([node.id]);
      let parent = node.parent ? byId.get(node.parent) : null;
      while (parent && !seen.has(parent.id)) {
        seen.add(parent.id);
        chain.push(parent.type);
        parent = parent.parent ? byId.get(parent.parent) : null;
      }
      chain.reverse();
      return chain;
    }

    async function selectAndCopyNode(node, rectBounds, render) {
      const loc = node.sourceFile && node.sourceLine
        ? node.sourceFile + ":" + node.sourceLine
        : (state.board?.sourceFile || "");
      if (loc) {
        els.selectedSource.textContent = loc + " (" + node.type + ")";
        try {
          await navigator.clipboard.writeText(loc);
        } catch {
          // Clipboard may be unavailable in headless browsers.
        }
        showToast("Selected & copied " + loc);
      }
      if (state.board?.sourcePath && node.sourceLine) {
        const chain = buildCallChain(node, render?.tree?.nodes || []);
        apiPost("/api/board/selection", {
          path: state.board.sourcePath,
          file: node.sourceFile || state.board.sourceFile || "",
          line: node.sourceLine,
          callName: node.type || "",
          callChain: chain,
          direction: render.direction || state.direction || "",
          screen: render.screen || state.screen || "",
          overlay: render.overlay || null,
          view: render.view || state.view || "",
          bounds: [rectBounds.x, rectBounds.y, rectBounds.width, rectBounds.height],
          contentHash: state.board.contentHash || "",
        }).catch(() => {});
      }
    }

    function normalizeHexColor(value) {
      if (!value) return "#6750A4";
      const clean = value.trim().replace(/^0x/i, "").replace(/^#/, "");
      if (clean.length === 8) return "#" + clean.slice(2).toUpperCase();
      if (clean.length === 6) return "#" + clean.toUpperCase();
      return "#6750A4";
    }

    function populateVariants() {
      els.ctrlVariant.innerHTML = "";
      for (const item of VARIANTS) {
        const opt = document.createElement("option");
        opt.value = item.value;
        opt.textContent = item.label;
        els.ctrlVariant.appendChild(opt);
      }
    }

    function setMode(mode) {
      state.mode = mode;
      els.tabGrid.classList.toggle("active", mode === "grid");
      els.tabStage.classList.toggle("active", mode === "stage");
      els.gridView.classList.toggle("hidden", mode !== "grid");
      els.stageView.classList.toggle("hidden", mode !== "stage");
      reportFocus();
      if (mode === "stage" && state.board?.valid) {
        refreshStageRender();
      }
    }

    function currentDirectionMeta() {
      const dirs = state.board?.boardMeta?.directions || [];
      return dirs.find((d) => d.name === state.direction) || dirs[0] || null;
    }

    function syncControlsFromBoard() {
      const b = state.board;
      if (!b) return;

      els.title.textContent = b.boardName || b.sourceFile || "Android Design Preview";
      els.surfacePill.textContent = b.surface || "phone";
      els.statusPill.textContent = b.valid ? (b.pass ? "all checks pass" : "findings need fixes") : "compile error";
      els.statusPill.className = "pill " + (b.valid && b.pass ? "pass" : "fail");

      if (!b.valid || (b.errors && b.errors.length > 0)) {
        const msg = (b.errors || []).map((e) => (e.path ? e.path + ": " : "") + e.message).join("\n");
        els.errorBanner.textContent = msg || "Compilation failed.";
        els.errorBanner.classList.remove("hidden");
      } else {
        els.errorBanner.classList.add("hidden");
      }

      if (!b.boardMeta) return;
      const dirs = b.boardMeta.directions || [];
      const views = b.boardMeta.views || [];

      if (!dirs.some((d) => d.name === state.direction)) {
        state.direction = dirs[0]?.name || null;
      }
      const dir = currentDirectionMeta();

      els.ctrlDirection.innerHTML = "";
      for (const d of dirs) {
        const opt = document.createElement("option");
        opt.value = d.name;
        opt.textContent = d.name;
        opt.selected = d.name === state.direction;
        els.ctrlDirection.appendChild(opt);
      }

      if (dir) {
        if (!dir.screens.includes(state.screen)) {
          state.screen = dir.startScreen || dir.screens[0] || null;
        }
        if (state.overlay && !dir.overlays.some((o) => o.id === state.overlay)) {
          state.overlay = "";
        }
        els.ctrlScreen.innerHTML = "";
        for (const s of dir.screens) {
          const opt = document.createElement("option");
          opt.value = s;
          opt.textContent = s;
          opt.selected = s === state.screen;
          els.ctrlScreen.appendChild(opt);
        }

        els.ctrlOverlay.innerHTML = "";
        const noneOpt = document.createElement("option");
        noneOpt.value = "";
        noneOpt.textContent = "None";
        noneOpt.selected = !state.overlay;
        els.ctrlOverlay.appendChild(noneOpt);
        for (const ov of dir.overlays) {
          const opt = document.createElement("option");
          opt.value = ov.id;
          opt.textContent = ov.screen ? ov.id + " (" + ov.screen + ")" : ov.id;
          opt.selected = ov.id === state.overlay;
          els.ctrlOverlay.appendChild(opt);
        }
      }

      if (!views.some((v) => v.name === state.view)) {
        state.view = views[0]?.name || null;
      }
      els.ctrlView.innerHTML = "";
      for (const v of views) {
        const opt = document.createElement("option");
        opt.value = v.name;
        opt.textContent = v.name + " (" + v.width + "x" + v.height + ")";
        opt.selected = v.name === state.view;
        els.ctrlView.appendChild(opt);
      }

      const seedHex = normalizeHexColor(state.seed || b.theme?.seed);
      els.ctrlSeedPicker.value = seedHex;
      els.ctrlSeedHex.value = seedHex;
      els.ctrlVariant.value = state.variant || b.theme?.variant || "tonal-spot";

      const isWear = b.surface === "wear";
      const activeViewSpec = views.find((v) => v.name === state.view);
      const effectiveDark = isWear ? true : (state.dark ?? activeViewSpec?.dark ?? false);
      els.btnLight.disabled = isWear;
      els.btnLight.classList.toggle("active", !effectiveDark);
      els.btnDark.classList.toggle("active", effectiveDark);
    }

    function renderDirectionGrid() {
      const b = state.board;
      els.gridView.innerHTML = "";
      if (!b || !b.valid || !b.boardMeta) return;

      const defaultView = b.surface === "wear" ? "watch" : "light";
      for (const dir of b.boardMeta.directions) {
        const cardKey = viewKey(dir.name, dir.startScreen, "", defaultView);
        const cached = state.viewsByKey.get(cardKey);
        const isStale = state.staleKeys.has(cardKey);

        const dirRenders = Array.from(state.viewsByKey.values()).filter((r) => r.direction === dir.name);
        const dirPass = dirRenders.length === 0 || dirRenders.every((r) => r.pass !== false);
        const failCount = dirRenders.reduce((n, r) => n + (r.failures?.length || 0), 0);

        const card = document.createElement("article");
        card.className = "card" + (isStale ? " is-stale" : "");

        const head = document.createElement("div");
        head.className = "card-head";
        const title = document.createElement("span");
        title.className = "card-title";
        title.textContent = dir.name;

        const right = document.createElement("div");
        right.className = "field-row";
        if (isStale) {
          const staleBadge = document.createElement("span");
          staleBadge.className = "pill stale";
          staleBadge.textContent = "updating";
          right.appendChild(staleBadge);
        }
        const status = document.createElement("span");
        status.className = "pill " + (dirPass ? "pass" : "fail");
        status.textContent = dirPass ? "pass" : failCount + " issue(s)";
        const focusBtn = document.createElement("button");
        focusBtn.type = "button";
        focusBtn.textContent = "Focus";
        focusBtn.onclick = () => {
          state.direction = dir.name;
          state.screen = dir.startScreen;
          state.overlay = "";
          syncControlsFromBoard();
          setMode("stage");
        };
        right.append(status, focusBtn);
        head.append(title, right);

        const preview = document.createElement("div");
        preview.className = "card-preview";
        preview.onclick = focusBtn.onclick;
        const img = document.createElement("img");
        img.alt = dir.name + " preview";
        preview.appendChild(img);

        if (cached?.pngBase64) {
          img.src = "data:image/png;base64," + cached.pngBase64;
        } else {
          apiPost("/api/board/render", {
            direction: dir.name,
            screen: dir.startScreen,
            view: defaultView,
          }).then((res) => {
            state.viewsByKey.set(cardKey, res);
            state.staleKeys.delete(cardKey);
            img.src = "data:image/png;base64," + res.pngBase64;
            card.classList.remove("is-stale");
          }).catch(() => {});
        }

        const meta = document.createElement("div");
        meta.className = "mono card-meta";
        meta.textContent = "screens: " + dir.screens.join(", ") + (dir.overlays.length ? " | overlays: " + dir.overlays.map((o) => o.id).join(", ") : "");

        card.append(head, preview, meta);
        els.gridView.appendChild(card);
      }
    }

    function boundsRect(bounds) {
      if (Array.isArray(bounds) && bounds.length === 4) {
        const [x, y, width, height] = bounds.map(Number);
        if (width > 0 && height > 0) return { x, y, width, height };
        return null;
      }
      if (bounds && typeof bounds === "object" && Number(bounds.width) > 0 && Number(bounds.height) > 0) {
        return {
          x: Number(bounds.x) || 0,
          y: Number(bounds.y) || 0,
          width: Number(bounds.width),
          height: Number(bounds.height),
        };
      }
      return null;
    }

    function hasRoleMetadata(roles) {
      if (!roles) return false;
      if (Array.isArray(roles)) return roles.length > 0;
      if (typeof roles === "object") return Object.values(roles).some(Boolean);
      return false;
    }

    function maybeSwitchTargetFromNode(node) {
      const dir = currentDirectionMeta();
      if (!dir || !node) return false;
      const roleValues = Array.isArray(node.roles)
        ? node.roles
        : (node.roles && typeof node.roles === "object" ? Object.values(node.roles).filter(Boolean) : []);
      const isNavOrTab =
        /nav|tab/i.test(node.type || "") ||
        /tab/i.test(node.a11y?.role || "") ||
        roleValues.some((r) => /nav|tab/i.test(String(r)));

      const candidates = [node.id, node.text?.value, node.a11y?.label]
        .filter(Boolean)
        .map((s) => String(s).trim().toLowerCase());

      if (isNavOrTab) {
        const matchedScreen = dir.screens.find((s) =>
          candidates.some((c) => c === s.toLowerCase() || s.toLowerCase().includes(c)),
        );
        if (matchedScreen && matchedScreen !== state.screen) {
          state.screen = matchedScreen;
          state.overlay = "";
          syncControlsFromBoard();
          reportFocus();
          refreshStageRender();
          return true;
        }
      }

      const matchedOverlay = dir.overlays.find((ov) =>
        candidates.some((c) => c === ov.id.toLowerCase()),
      );
      if (matchedOverlay) {
        state.overlay = state.overlay === matchedOverlay.id ? "" : matchedOverlay.id;
        syncControlsFromBoard();
        reportFocus();
        refreshStageRender();
        return true;
      }
      return false;
    }

    function renderStageOverlay(render) {
      const views = state.board?.boardMeta?.views || [];
      const viewSpec = views.find((v) => v.name === render.view) || { width: 412, height: 915 };
      const svg = els.stageSvg;
      svg.setAttribute("viewBox", "0 0 " + viewSpec.width + " " + viewSpec.height);
      svg.innerHTML = "";
      els.nodeList.innerHTML = "";

      if (!state.showBoxes || !render.tree?.nodes) {
        svg.classList.add("hidden");
        return;
      }
      svg.classList.remove("hidden");

      const laidOut = render.tree.nodes
        .map((node) => ({ node, rectBounds: boundsRect(node.bounds) }))
        .filter((entry) => entry.rectBounds !== null);

      laidOut.forEach(({ node, rectBounds }, idx) => {
        const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        rect.setAttribute("x", String(rectBounds.x));
        rect.setAttribute("y", String(rectBounds.y));
        rect.setAttribute("width", String(rectBounds.width));
        rect.setAttribute("height", String(rectBounds.height));
        rect.setAttribute("class", "node" + (node.primary ? " primary" : ""));
        rect.dataset.index = String(idx);

        const loc = node.sourceFile && node.sourceLine
          ? node.sourceFile + ":" + node.sourceLine
          : (state.board?.sourceFile || "");
        const dims = Math.round(rectBounds.width) + "x" + Math.round(rectBounds.height) + " dp";
        const label = node.type + (node.id ? "#" + node.id : "") + " (" + dims + ") " + loc;

        rect.addEventListener("mouseenter", () => {
          els.hoverInfo.textContent = label;
        });
        rect.addEventListener("click", (ev) => {
          ev.stopPropagation();
          for (const child of svg.querySelectorAll("rect.selected")) {
            child.classList.remove("selected");
          }
          rect.classList.add("selected");
          state.selectedNode = node;
          selectAndCopyNode(node, rectBounds, render);
          maybeSwitchTargetFromNode(node);
        });
        svg.appendChild(rect);

        if (node.sourceLine || node.primary || hasRoleMetadata(node.roles)) {
          const item = document.createElement("button");
          item.type = "button";
          item.className = "mono node-item";
          item.textContent = label;
          item.onclick = () => selectAndCopyNode(node, rectBounds, render);
          els.nodeList.appendChild(item);
        }
      });
    }

    function renderStageFindings(render) {
      els.stageFindings.innerHTML = "";
      const errs = Array.isArray(render.check?.errors) ? render.check.errors : [];
      const notesList = Array.isArray(render.check?.notes) ? render.check.notes : [];

      if (errs.length === 0 && notesList.length === 0) {
        const ok = document.createElement("div");
        ok.className = "pill pass";
        ok.textContent = "Zero findings for this view";
        els.stageFindings.appendChild(ok);
        return;
      }
      for (const e of errs) {
        const div = document.createElement("div");
        div.className = "finding error";
        const idsText = Array.isArray(e.ids) && e.ids.length ? e.ids.join(", ") : "";
        const tail = [idsText, e.detail, e.reference ? "[" + e.reference + "]" : ""].filter(Boolean).join(" ");
        div.textContent = (e.rule || "error") + (tail ? ": " + tail : "");
        els.stageFindings.appendChild(div);
      }
      for (const note of notesList) {
        const div = document.createElement("div");
        div.className = "finding info";
        const ids = Array.isArray(note.ids) ? note.ids.join(", ") : String(note.ids || "");
        div.textContent = (note.rule || "info") + (ids ? ": " + ids : "");
        els.stageFindings.appendChild(div);
      }
    }

    function applyStageRender(render) {
      state.stageRender = render;
      els.frameBox.classList.remove("is-stale");
      const b64 = state.showEndFrame && render.endPngBase64 ? render.endPngBase64 : render.pngBase64;
      if (b64) els.stageImg.src = "data:image/png;base64," + b64;
      els.btnScrollFrame.classList.toggle("hidden", !render.endPngBase64);
      els.btnScrollFrame.textContent = state.showEndFrame ? "Scrolled End" : "Top Frame";
      els.renderMeta.textContent = render.view + " | " + render.renderMs + " ms";
      renderStageOverlay(render);
      renderStageFindings(render);
    }

    async function refreshStageRender() {
      if (!state.board?.valid || !state.direction) return;
      try {
        const params = {
          direction: state.direction,
          screen: state.screen,
          ...(state.overlay ? { overlay: state.overlay } : {}),
          ...(state.view ? { view: state.view } : {}),
          ...(state.seed ? { seed: state.seed } : {}),
          ...(state.variant ? { variant: state.variant } : {}),
          ...(state.dark !== null && state.board.surface !== "wear" ? { dark: state.dark } : {}),
        };
        const render = await apiPost("/api/board/render", params);
        applyStageRender(render);
      } catch (err) {
        els.hoverInfo.textContent = "Render error: " + err.message;
      }
    }

    function applyBoardUpdate(board) {
      const prevHash = state.board?.contentHash;
      state.board = board;
      state.halted = false;
      els.haltedBanner.classList.add("hidden");
      if (prevHash && board.contentHash && prevHash !== board.contentHash) {
        for (const k of state.viewsByKey.keys()) {
          state.staleKeys.add(k);
        }
        els.frameBox.classList.add("is-stale");
      }
      if (Array.isArray(board.staleViews)) {
        for (const v of board.staleViews) {
          state.staleKeys.add(viewKey(v.direction, v.screen, v.overlay || "", v.view));
        }
      }
      if (Array.isArray(board.renders)) {
        for (const r of board.renders) {
          const k = viewKey(r.direction, r.screen, r.overlay || "", r.view);
          state.viewsByKey.set(k, r);
          state.staleKeys.delete(k);
        }
      }
      syncControlsFromBoard();
      renderDirectionGrid();
      reportFocus();
      if (state.mode === "stage") {
        refreshStageRender();
      }
    }

    function applyStaleEvent(payload) {
      const keys = Array.isArray(payload.views) ? payload.views : [];
      if (keys.length === 0) {
        for (const k of state.viewsByKey.keys()) state.staleKeys.add(k);
      } else {
        for (const v of keys) state.staleKeys.add(viewKey(v.direction, v.screen, v.overlay || "", v.view));
      }
      els.frameBox.classList.add("is-stale");
      renderDirectionGrid();
    }

    function applyViewUpdated(render) {
      const k = viewKey(render.direction, render.screen, render.overlay || "", render.view);
      state.viewsByKey.set(k, render);
      state.staleKeys.delete(k);
      if (state.board && render.contentHash) {
        state.board.contentHash = render.contentHash;
      }
      renderDirectionGrid();
      const matchesStage =
        state.mode === "stage" &&
        render.direction === state.direction &&
        render.screen === state.screen &&
        (render.overlay || "") === (state.overlay || "") &&
        render.view === state.view &&
        !state.seed && !state.variant && state.dark === null;
      if (matchesStage) {
        applyStageRender(render);
      }
    }

    async function init() {
      populateVariants();

      els.tabGrid.onclick = () => setMode("grid");
      els.tabStage.onclick = () => setMode("stage");
      els.ctrlDirection.onchange = () => {
        state.direction = els.ctrlDirection.value;
        state.screen = null;
        state.overlay = "";
        syncControlsFromBoard();
        reportFocus();
        refreshStageRender();
      };
      els.btnLight.onclick = () => {
        state.dark = false;
        syncControlsFromBoard();
        refreshStageRender();
      };
      els.btnDark.onclick = () => {
        state.dark = true;
        syncControlsFromBoard();
        refreshStageRender();
      };
      els.ctrlSeedPicker.oninput = () => {
        state.seed = els.ctrlSeedPicker.value;
        els.ctrlSeedHex.value = state.seed.toUpperCase();
        refreshStageRender();
      };
      els.ctrlSeedHex.onchange = () => {
        const norm = normalizeHexColor(els.ctrlSeedHex.value);
        state.seed = norm;
        els.ctrlSeedPicker.value = norm;
        els.ctrlSeedHex.value = norm;
        refreshStageRender();
      };
      els.btnSeedReset.onclick = () => {
        state.seed = null;
        state.variant = null;
        state.dark = null;
        syncControlsFromBoard();
        refreshStageRender();
      };
      els.ctrlVariant.onchange = () => {
        state.variant = els.ctrlVariant.value;
        refreshStageRender();
      };
      els.ctrlScreen.onchange = () => {
        state.screen = els.ctrlScreen.value;
        reportFocus();
        refreshStageRender();
      };
      els.ctrlOverlay.onchange = () => {
        state.overlay = els.ctrlOverlay.value;
        reportFocus();
        refreshStageRender();
      };
      els.ctrlView.onchange = () => {
        state.view = els.ctrlView.value;
        syncControlsFromBoard();
        reportFocus();
        refreshStageRender();
      };
      els.btnToggleBoxes.onclick = () => {
        state.showBoxes = !state.showBoxes;
        els.btnToggleBoxes.classList.toggle("active", state.showBoxes);
        if (state.stageRender) renderStageOverlay(state.stageRender);
      };
      els.btnScrollFrame.onclick = () => {
        state.showEndFrame = !state.showEndFrame;
        if (state.stageRender) applyStageRender(state.stageRender);
      };

      try {
        const res = await fetch("/api/board", {
          headers: { "X-View-Token": VIEW_TOKEN },
        });
        if (res.ok) {
          const board = await res.json();
          if (board && board.sourcePath) applyBoardUpdate(board);
        }
      } catch (err) {
        els.errorBanner.textContent = "Failed loading initial board: " + err.message;
        els.errorBanner.classList.remove("hidden");
      }

      const events = new EventSource("/api/events?view=" + encodeURIComponent(VIEW_TOKEN));
      events.onopen = () => {
        els.livePill.textContent = "SSE live";
        els.livePill.className = "pill pass";
        if (!state.halted) els.haltedBanner.classList.add("hidden");
      };
      events.onerror = () => {
        els.livePill.textContent = state.halted ? "Server stopped" : "SSE reconnecting";
        els.livePill.className = "pill fail";
      };
      events.addEventListener("board", (ev) => {
        try {
          applyBoardUpdate(JSON.parse(ev.data));
        } catch {
          // Ignore malformed payload.
        }
      });
      events.addEventListener("stale", (ev) => {
        try {
          applyStaleEvent(JSON.parse(ev.data));
        } catch {
          // Ignore.
        }
      });
      events.addEventListener("view_updated", (ev) => {
        try {
          applyViewUpdated(JSON.parse(ev.data));
        } catch {
          // Ignore.
        }
      });
      events.addEventListener("error_event", (ev) => {
        try {
          const payload = JSON.parse(ev.data);
          els.errorBanner.textContent = payload.message || "Recompile failed";
          els.errorBanner.classList.remove("hidden");
        } catch {
          // Ignore.
        }
      });
      events.addEventListener("halted", (ev) => {
        try {
          const payload = JSON.parse(ev.data);
          state.halted = true;
          els.livePill.textContent = "Server halted";
          els.livePill.className = "pill fail";
          const restartCmd = payload.restartCommand || "android-design-preview open <file>";
          els.haltedBanner.textContent =
            "Server stopped after timeout (" + (payload.scope || "render") + "). Restart with: " + restartCmd;
          els.haltedBanner.classList.remove("hidden");
        } catch {
          // Ignore.
        }
      });
      events.addEventListener("recycling", () => {
        els.livePill.textContent = "SSE reconnecting";
        els.livePill.className = "pill stale";
      });
    }

    init();
  </script>
</body>
</html>
